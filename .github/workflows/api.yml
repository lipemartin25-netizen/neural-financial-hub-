name: API CI

on:
  push:
    paths:
      - 'services/api/**'
      - 'services/worker/**'
      - 'supabase/migrations/**'
      - 'packages/contracts/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'services/worker/**'
      - 'supabase/migrations/**'
      - 'packages/contracts/**'
      - '.github/workflows/api.yml'

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (API)
        run: |
          pytest -v tests/
        env:
          JWT_SECRET: "test-secret-key-for-ci-validations-min-32-chars"
          ENVIRONMENT: "test"
